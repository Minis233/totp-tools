<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>2FA 多账号管理器</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="开源 2FA / TOTP 多账号管理器，支持扫码导入、相册导入、Base32 手动添加。">
  <link rel="icon" type="image/svg+xml" href="/assets/img/favicon.svg">
  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="stylesheet" href="/assets/css/ui-v4.css?v=20260804">
  <script src="/assets/js/otpauth.umd.min.js"></script>
  <script src="/assets/js/qrcode.min.js"></script>
  <script src="/assets/js/jsQR.js"></script>
  <script src="/assets/js/common.js?v=20260714b"></script>
</head>
<body>
  <div class="layout">
    <aside class="sidebar" data-sidebar></aside>
    <main>
      <div class="panel hero">
        <h1>🔐 2FA 多账号管理器</h1>
        <p class="lead">本地保存多组 TOTP 密钥，自动按 30 秒周期刷新。所有数据只存在浏览器本地，不上传服务端。</p>
        <hr>

        <div class="row">
          <input id="remark" class="input" type="text" placeholder="账号备注（如 Google、GitHub、AWS）">
        </div>
        <div class="row">
          <input id="secret" class="input" type="text" placeholder="Base32 秘钥（如 JBSWY3DPEHPK3PXP）" autocomplete="off" autocapitalize="characters" spellcheck="false">
        </div>
        <div class="row">
          <button id="btn-add"  class="btn">添加账号</button>
          <button id="btn-once" class="btn ghost">临时查看</button>
          <button id="btn-scan" class="btn subtle">扫码导入</button>
          <button id="btn-pick" class="btn subtle">相册导入</button>
          <button id="btn-export" class="btn subtle">导出</button>
          <button id="btn-import" class="btn subtle">导入</button>
          <input id="file-qr" type="file" accept="image/*" hidden>
          <input id="file-json" type="file" accept="application/json,.json" hidden>
        </div>

        <div id="scanner" class="scanner" hidden>
          <video id="video" autoplay playsinline muted></video>
          <div class="row" style="margin-top:8px">
            <button id="btn-stop" class="btn danger">停止扫码</button>
            <span class="muted small">需要 HTTPS 与摄像头权限。如无法开启请改用「相册导入」。</span>
          </div>
        </div>
      </div>

      <div class="toolbar">
        <input id="search" class="input search-input" type="search" placeholder="🔍 搜索账号备注或 issuer..." autocomplete="off">
      </div>

      <div id="list"></div>

      <footer class="foot">© 在线工具 · 开源 MIT · 数据仅保存在浏览器本地</footer>
    
  <script>
  (function(){
    'use strict';
    const $ = s => document.querySelector(s);
    const STORAGE = window.localStorage;
    const LS_KEY = 'totp.accounts';

    // -------- state --------
    let accounts = [];
    let needsResave = false;
    const seenIds = new Set();
    try {
      const stored = JSON.parse(STORAGE.getItem(LS_KEY) || '[]');
      accounts = Array.isArray(stored)
        ? stored
            .filter(a => a && typeof a === 'object' && typeof a.secret === 'string')
            .map(a => {
              const meta = sanitizeMeta(a.algorithm, a.digits, a.period);
              if(a.algorithm !== meta.algorithm || a.digits !== meta.digits || a.period !== meta.period) needsResave = true;
              // Records saved by older builds (or hand-edited JSON) may lack a
              // usable id. Without one every card renders data-id="undefined",
              // so copy/edit/delete all resolve to the first match.
              let id = typeof a.id === 'string' ? a.id.trim() : '';
              if(!id || seenIds.has(id)){ id = newId(); needsResave = true; }
              else seenIds.add(id);
              // Normalize the stored secret too. Records written by older builds
              // (or hand-edited exports) can still carry padding / hyphens, and
              // the decoder throws on those — every code showed "错误".
              const secret = normSecret(a.secret);
              if(secret !== a.secret) needsResave = true;
              return { ...a, id, secret, algorithm: meta.algorithm, digits: meta.digits, period: meta.period };
            })
            .filter(a => a.secret && /^[A-Z2-7]+$/.test(a.secret))
        : [];
    } catch(e){ accounts = []; }
    const save = () => STORAGE.setItem(LS_KEY, JSON.stringify(accounts));
    // Rewrite storage once if any legacy record was sanitized on load.
    if(needsResave){ try { save(); } catch(_){} }

    function uid(){ return Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4); }

    // Always allocate ids through here so a fresh id can never collide with one
    // already held by an existing account (uid() is time+random, but bulk
    // imports run inside the same millisecond).
    function newId(){
      let id = uid();
      while(seenIds.has(id)) id = uid();
      seenIds.add(id);
      return id;
    }

    // Normalize a Base32 secret: drop whitespace and the separators services
    // commonly print (hyphens / underscores), strip "=" padding and any stray
    // quotes (e.g. pasted from a shell command), upcase.
    // Padding, hyphens and quotes are display sugar — the decoder must not see them.
    function normSecret(raw){
      // Invisible Unicode chars (zero-width space U+200B, ZWJ U+200D,
      // soft hyphen U+00AD, BOM U+FEFF, LRM/RLM U+200E/F, word joiner U+2060,
      // Arabic letter mark U+061C, full-width space U+3000, ...) piggyback on
      // text copied from chats/websites/PDFs and break Base32 decoding.
      // \s alone misses most of these — strip them explicitly by code point.
      const UNICODE_INVISIBLE = /[\u200B\u200C\u200D\u2060\u2064\u00AD\u061C\u200E\u200F\uFEFF\u3000\u202F\u1680\u180E\u205F]/g;
      return String(raw || '')
        .replace(/[\s\-_]+/g, '')
        .replace(UNICODE_INVISIBLE, '')
        .toUpperCase()
        .replace(/[=\s'"`]+/g, '');
    }

    // Minimum length: RFC 4648 Base32 needs 8 chars to carry a 5-byte key,
    // which is the shortest secret real services issue. Rejecting under 16
    // locked out valid accounts.
    const SECRET_MIN = 8;

    function validateSecret(raw){
      const s = normSecret(raw);
      // Empty / whitespace-only input must not fail silently — the add and
      // "view once" buttons both give no feedback today, which looks broken.
      if(!s){ window.toast('请填写密钥'); return null; }
      if(s.length < SECRET_MIN){ window.toast('密钥太短，至少 ' + SECRET_MIN + ' 位 Base32'); return null; }
      if(s.length > 128){ window.toast('密钥过长'); return null; }
      if(!/^[A-Z2-7]+$/.test(s)){ window.toast('非法 Base32：只允许 A–Z 与 2–7'); return null; }
      // Final gate: let the decoder confirm it is actually decodable.
      try { OTPAuth.Secret.fromBase32(s); }
      catch(e){ window.toast('密钥无法解析为 Base32'); return null; }
      return s;
    }

    function makeTOTP(acc){
      return new OTPAuth.TOTP({
        issuer: acc.issuer || '',
        label:  acc.remark || '账号',
        algorithm: acc.algorithm || 'SHA1',
        digits: acc.digits || 6,
        period: acc.period || 30,
        secret: OTPAuth.Secret.fromBase32(acc.secret)
      });
    }

    function genCode(acc, tsMs){
      try { return makeTOTP(acc).generate({ timestamp: tsMs }); }
      catch(e){ return '错误'; }
    }

    // -------- render --------
    const list = $('#list');
    let searchQuery = '';
    const RING_R = 20, RING_C = 2 * Math.PI * RING_R;

    function filteredAccounts(){
      if(!searchQuery) return accounts;
      const q = searchQuery.toLowerCase();
      return accounts.filter(a =>
        (a.remark || '').toLowerCase().includes(q) ||
        (a.issuer || '').toLowerCase().includes(q)
      );
    }

    function renderEmpty(icon, message){
      const panel = document.createElement('div');
      panel.className = 'panel';
      const empty = document.createElement('div');
      empty.className = 'empty-state';
      const ico = document.createElement('div');
      ico.className = 'ico';
      ico.textContent = icon;
      const text = document.createElement('div');
      text.textContent = message;
      empty.append(ico, text);
      panel.appendChild(empty);
      list.appendChild(panel);
    }

    function render(){
      list.innerHTML = '';
      const visible = filteredAccounts();
      if(!accounts.length){
        renderEmpty('＋', '暂无账号，添加或扫码导入一个试试。');
        return;
      }
      if(!visible.length){
        renderEmpty('⌕', `没有匹配「${searchQuery}」的账号`);
        return;
      }
      for(const acc of visible){
        const card = document.createElement('div');
        card.className = 'panel acc-card';
        card.dataset.id = acc.id;
        card.innerHTML = `
          <div class="acc-row">
            <div class="acc-meta">
              <div class="acc-name" data-edit="remark" contenteditable="true" spellcheck="false"></div>
              <div class="acc-issuer muted small"></div>
              <div class="otp-block">
                <div class="otp" data-otp data-act="copy" title="点击复制">------</div>
                <div class="ring">
                  <svg viewBox="0 0 48 48" aria-hidden="true">
                    <circle class="ring-bg" cx="24" cy="24" r="${RING_R}"/>
                    <circle class="ring-fg" data-ring cx="24" cy="24" r="${RING_R}"
                      stroke-dasharray="${RING_C.toFixed(2)}" stroke-dashoffset="0"/>
                  </svg>
                  <div class="ring-text" data-ring-text>--</div>
                </div>
              </div>
            </div>
            <div class="acc-ctrl">
              <button class="btn ghost btn-sm" data-act="copy" title="复制验证码">📋</button>
              <button class="btn ghost btn-sm" data-act="qr" title="生成二维码">▦</button>
              <button class="btn ghost btn-sm" data-act="edit" title="编辑密钥">✎</button>
              <button class="btn ghost btn-sm" data-act="up" title="上移">↑</button>
              <button class="btn ghost btn-sm" data-act="down" title="下移">↓</button>
              <button class="btn danger btn-sm" data-act="del" title="删除">🗑</button>
            </div>
          </div>`;
        card.querySelector('.acc-name').textContent = acc.remark || '未命名';
        card.querySelector('.acc-issuer').textContent = acc.issuer ? '· ' + acc.issuer : '';
        list.appendChild(card);
      }
      tick(true);
    }

    // -------- ticking --------
    function tick(force){
      const ms = Date.now();
      const sec = Math.floor(ms / 1000);
      for(const acc of accounts){
        const period = acc.period || 30;
        const left = period - (sec % period);
        const card = list.querySelector(`[data-id="${CSS.escape(acc.id)}"]`);
        if(!card) continue;
        const otpEl = card.querySelector('[data-otp]');
        const ring = card.querySelector('[data-ring]');
        const ringText = card.querySelector('[data-ring-text]');

        const code = genCode(acc, ms);
        const display = code.length === 6 ? code.slice(0,3) + ' ' + code.slice(3) : code;
        otpEl.textContent = display;

        const warn = left <= 5;
        otpEl.classList.toggle('warn', warn);

        if(ring){
          const offset = (1 - left / period) * RING_C;
          ring.style.strokeDashoffset = offset.toFixed(2);
          ring.classList.toggle('warn', warn);
        }
        if(ringText){
          ringText.textContent = left;
          ringText.classList.toggle('warn', warn);
        }
      }
    }
    setInterval(tick, 1000);

    // -------- list event delegation --------
    list.addEventListener('click', (e) => {
      const btn = e.target.closest('[data-act]');
      if(!btn) return;
      const card = e.target.closest('[data-id]');
      if(!card) return;
      const id = card.dataset.id;
      const i = accounts.findIndex(a => a.id === id);
      if(i < 0) return;
      const act = btn.dataset.act;
      if(act === 'copy'){
        const code = genCode(accounts[i], Date.now()).replace(/\s/g,'');
        window.copyText(code).then(ok => ok && window.toast('已复制 ' + code));
      } else if(act === 'qr'){
        showQR(accounts[i]);
      } else if(act === 'edit'){
        const v = prompt('请输入新的 Base32 秘钥：', accounts[i].secret || '');
        if(v == null) return;
        const s = validateSecret(v);
        if(!s) return;
        accounts[i].secret = s; save(); render();
      } else if(act === 'up' && i > 0){
        [accounts[i-1], accounts[i]] = [accounts[i], accounts[i-1]]; save(); render();
      } else if(act === 'down' && i < accounts.length - 1){
        [accounts[i+1], accounts[i]] = [accounts[i], accounts[i+1]]; save(); render();
      } else if(act === 'del'){
        if(confirm('确认删除「' + (accounts[i].remark || '该账号') + '」？')){
          accounts.splice(i, 1); save(); render();
        }
      }
    });

    list.addEventListener('blur', (e) => {
      const node = e.target.closest('[data-edit="remark"]');
      if(!node) return;
      const card = e.target.closest('[data-id]');
      const i = accounts.findIndex(a => a.id === card.dataset.id);
      if(i < 0) return;
      const newName = (node.textContent || '').trim() || '未命名';
      if(newName !== accounts[i].remark){
        accounts[i].remark = newName;
        save();
      }
      node.textContent = newName;
    }, true);

    list.addEventListener('keydown', (e) => {
      if(e.target.matches('[data-edit="remark"]') && e.key === 'Enter'){
        e.preventDefault(); e.target.blur();
      }
    });

    // -------- add / once --------
    // Clamp TOTP parameters to supported ranges — shared by QR / JSON / manual add
    // so no import path can inject bad values (e.g. digits:999, period:-5).
    function sanitizeMeta(algorithm, digits, period){
      const algo = String(algorithm || 'SHA1').toUpperCase();
      const d = parseInt(digits, 10);
      const p = parseInt(period, 10);
      return {
        algorithm: ['SHA1','SHA256','SHA512'].includes(algo) ? algo : 'SHA1',
        digits: [6,7,8].includes(d) ? d : 6,
        period: (Number.isInteger(p) && p >= 5 && p <= 300) ? p : 30,
      };
    }

    function addAccount(remark, secret, extra = {}){
      const s = validateSecret(secret);
      if(!s) return false;
      const meta = sanitizeMeta(extra.algorithm, extra.digits, extra.period);
      accounts.push({
        id: newId(),
        remark: (remark || '未命名').trim(),
        issuer: extra.issuer || '',
        secret: s,
        algorithm: meta.algorithm,
        digits: meta.digits,
        period: meta.period,
      });
      save(); render();
      window.toast('已添加账号');
      return true;
    }

    $('#btn-add').addEventListener('click', () => {
      const r = $('#remark').value.trim();
      const s = $('#secret').value;
      if(!r){ return window.toast('请填写账号备注'); }
      if(addAccount(r, s)){ $('#remark').value = ''; $('#secret').value = ''; }
    });

    $('#btn-once').addEventListener('click', () => {
      const s = validateSecret($('#secret').value);
      if(!s) return;
      const code = genCode({ secret: s }, Date.now());
      const left = 30 - (Math.floor(Date.now()/1000) % 30);
      window.copyText(code);
      window.toast(`一次性验证码：${code}（剩余 ${left} 秒，已复制）`);
    });

    // -------- QR display --------
    function showQR(acc){
      const totp = makeTOTP(acc);
      const uri = totp.toString();
      const box = $('#qrcode');
      box.innerHTML = '';
      new QRCode(box, { text: uri, width: 240, height: 240, correctLevel: QRCode.CorrectLevel.M });
      $('#qr-modal').classList.add('open');
    }
    (window.__pageOn || document.addEventListener.bind(document))(document, 'click', (e) => {
      if(e.target && e.target.matches('[data-close]')) $('#qr-modal').classList.remove('open');
      if(e.target && e.target.id === 'qr-modal')      $('#qr-modal').classList.remove('open');
    });
    (window.__pageOn || document.addEventListener.bind(document))(document, 'keydown', (e) => {
      if(e.key === 'Escape') $('#qr-modal').classList.remove('open');
    });

    // -------- otpauth:// parsing --------
    function handleOtpauthUri(data){
      try{
        if(!/^otpauth:\/\//i.test(data)) throw new Error('不是 otpauth 链接');
        const u = new URL(data);
        const type = u.host.toLowerCase(); // totp / hotp
        if(type !== 'totp') throw new Error('暂不支持 ' + type.toUpperCase());
        const labelRaw = decodeURIComponent(u.pathname.replace(/^\//, ''));
        // Label is "Issuer:Account". Only the FIRST colon separates the two —
        // account names are often emails or contain colons, and splitting on
        // every colon truncated them (e.g. "GitHub:user:extra@x.com" -> "user").
        let issuer = u.searchParams.get('issuer') || '';
        let remark = labelRaw;
        const sep = labelRaw.indexOf(':');
        if(sep > -1){
          issuer = issuer || labelRaw.slice(0, sep).trim();
          remark = labelRaw.slice(sep + 1).trim();
        }
        const secret = normSecret(u.searchParams.get('secret') || '');
        if(!secret){ throw new Error('二维码中缺少 secret'); }
        const algorithm = (u.searchParams.get('algorithm') || 'SHA1').toUpperCase();
        const digits = parseInt(u.searchParams.get('digits') || '6', 10);
        const period = parseInt(u.searchParams.get('period') || '30', 10);
        if(!['SHA1','SHA256','SHA512'].includes(algorithm)) throw new Error('不支持的算法');
        if(![6,7,8].includes(digits)) throw new Error('验证码位数必须为 6–8');
        if(!Number.isInteger(period) || period < 5 || period > 300) throw new Error('刷新周期无效');
        return { remark: remark || issuer || '未命名', issuer, secret, algorithm, digits, period };
      }catch(e){
        window.toast('二维码无效：' + e.message);
        return null;
      }
    }

    // -------- gallery import --------
    $('#btn-pick').addEventListener('click', () => $('#file-qr').click());
    $('#file-qr').addEventListener('change', (e) => {
      const f = e.target.files && e.target.files[0]; if(!f) return;
      const reader = new FileReader();
      reader.onload = () => {
        const img = new Image();
        img.onload = () => {
          const c = document.createElement('canvas');
          c.width = img.width; c.height = img.height;
          const ctx = c.getContext('2d');
          ctx.drawImage(img, 0, 0);
          const im = ctx.getImageData(0, 0, c.width, c.height);
          const qr = jsQR(im.data, c.width, c.height);
          if(!qr){ window.toast('无法识别二维码，请确认图片清晰'); return; }
          const parsed = handleOtpauthUri(qr.data);
          if(parsed) addAccount(parsed.remark, parsed.secret, parsed);
        };
        img.onerror = () => window.toast('图片加载失败');
        img.src = reader.result;
      };
      reader.readAsDataURL(f);
      e.target.value = '';
    });

    // -------- camera scan --------
    let stream = null, scanRAF = null;
    $('#btn-scan').addEventListener('click', async () => {
      if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
        return window.toast('当前浏览器不支持摄像头扫码，请改用相册导入');
      }
      $('#scanner').hidden = false;
      try {
        stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
        const v = $('#video');
        v.srcObject = stream;
        await v.play().catch(() => {});
        scanLoop();
      } catch(e){
        window.toast('无法打开摄像头：' + (e.message || e));
        $('#scanner').hidden = true;
      }
    });
    $('#btn-stop').addEventListener('click', stopScan);
    (window.__pageOn || ((t,e,f)=>t.addEventListener(e,f)))(window, 'app:page-cleanup', stopScan);
    function stopScan(){
      if(scanRAF){ cancelAnimationFrame(scanRAF); scanRAF = null; }
      if(stream){ stream.getTracks().forEach(t => t.stop()); stream = null; }
      $('#scanner').hidden = true;
    }
    function scanLoop(){
      if(!stream) return;
      const v = $('#video');
      const c = document.createElement('canvas');
      const ctx = c.getContext('2d');
      const loop = () => {
        if(!stream) return;
        if(v.readyState === v.HAVE_ENOUGH_DATA && v.videoWidth){
          c.width = v.videoWidth; c.height = v.videoHeight;
          ctx.drawImage(v, 0, 0, c.width, c.height);
          const im = ctx.getImageData(0, 0, c.width, c.height);
          const qr = jsQR(im.data, c.width, c.height, { inversionAttempts: 'attemptBoth' });
          if(qr){
            const parsed = handleOtpauthUri(qr.data);
            stopScan();
            if(parsed) addAccount(parsed.remark, parsed.secret, parsed);
            return;
          }
        }
        scanRAF = requestAnimationFrame(loop);
      };
      scanRAF = requestAnimationFrame(loop);
    }

    // -------- export / import --------
    $('#btn-export').addEventListener('click', () => {
      if(!accounts.length){ return window.toast('暂无账号可导出'); }
      const blob = new Blob([JSON.stringify(accounts, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'totp-accounts-' + new Date().toISOString().slice(0,10) + '.json';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
    });
    $('#btn-import').addEventListener('click', () => $('#file-json').click());
    $('#file-json').addEventListener('change', (e) => {
      const f = e.target.files && e.target.files[0]; if(!f) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const data = JSON.parse(reader.result);
          if(!Array.isArray(data)) throw new Error('文件格式不正确');
          let n = 0;
          let skipped = 0;
          for(const a of data){
            const s = normSecret(a && a.secret);
            // Same rules as manual add / QR import, but silent per-record so one
            // bad row can't spam toasts or abort the whole file.
            if(!s || s.length < SECRET_MIN || s.length > 128 || !/^[A-Z2-7]+$/.test(s)){ skipped++; continue; }
            const meta = sanitizeMeta(a.algorithm, a.digits, a.period);
            accounts.push({
              id: newId(),
              remark: a.remark || a.label || '未命名',
              issuer: a.issuer || '',
              secret: s,
              algorithm: meta.algorithm,
              digits: meta.digits,
              period: meta.period,
            });
            n++;
          }
          save(); render();
          window.toast(skipped ? `已导入 ${n} 个账号，跳过 ${skipped} 条无效记录` : '已导入 ' + n + ' 个账号');
        } catch(err){
          window.toast('导入失败：' + err.message);
        }
      };
      reader.readAsText(f);
      e.target.value = '';
    });

    // -------- search ----------
    const searchInput = $('#search');
    if(searchInput){
      searchInput.addEventListener('input', (e) => {
        searchQuery = e.target.value.trim();
        render();
      });
    }

    // -------- URL params support: ?key=… or /2fa/<KEY> --------
    (function bootstrapFromUrl(){
      const url = new URL(location.href);
      let auto = url.searchParams.get('key');
      const m = url.pathname.match(/\/2fa\/([A-Za-z2-7]+)\/?$/);
      if(!auto && m) auto = m[1];
      if(auto){
        const s = validateSecret(auto);
        if(s) $('#secret').value = s;
      }
    })();

    render();
  })();
  </script>
    </main>

</body>
