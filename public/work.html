<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>图片处理</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="纯前端图片处理：压缩、缩放、格式转换（JPG / PNG / WEBP）、Base64。">
  <link rel="icon" type="image/svg+xml" href="/assets/img/favicon.svg">
  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="stylesheet" href="/assets/css/ui-v4.css?v=20260804">
  <script src="/assets/js/otpauth.umd.min.js"></script>
  <script src="/assets/js/qrcode.min.js"></script>
  <script src="/assets/js/jsQR.js"></script>
  <script src="/assets/js/common.js?v=20260714b"></script>
</head>
<body>
  <div class="layout">
    <aside class="sidebar" data-sidebar></aside>
    <main>
      <div class="panel hero">
        <h1>🖼️ 图片处理</h1>
        <p class="lead">纯前端运行，文件不上传服务器：压缩、缩放、格式转换（JPG / PNG / WEBP）、转 Base64。</p>
        <hr>

        <div id="drop" class="dropzone">
          <div>拖拽图片到这里 / 点击选择文件 / Ctrl+V 粘贴</div>
          <div class="small muted">支持 JPG · PNG · WEBP · GIF · BMP</div>
          <input id="file" type="file" accept="image/*" hidden>
        </div>

        <div id="ctrl" class="grid-2" style="margin-top:14px;display:none">
          <div class="col">
            <label class="muted small">最大宽（px）</label>
            <input id="maxW" class="input" type="number" min="1" placeholder="留空保持原宽">
            <label class="muted small">最大高（px）</label>
            <input id="maxH" class="input" type="number" min="1" placeholder="留空保持原高">
            <label class="muted small">输出格式</label>
            <select id="fmt">
              <option value="image/jpeg">JPEG (.jpg)</option>
              <option value="image/png">PNG (.png)</option>
              <option value="image/webp">WEBP (.webp)</option>
            </select>
            <label class="muted small">质量（仅 JPEG / WEBP，0–1）</label>
            <input id="q" class="input" type="number" step="0.05" min="0.1" max="1" value="0.85">
            <div class="row" style="margin-top:6px">
              <button id="apply" class="btn">处理并预览</button>
              <button id="download" class="btn ghost">下载</button>
              <button id="copyB64" class="btn ghost">复制 Base64</button>
            </div>
          </div>
          <div class="col">
            <label class="muted small">预览</label>
            <canvas id="cv" class="preview"></canvas>
            <div id="info" class="kv"><span class="label">信息</span><span class="value muted">-</span></div>
          </div>
        </div>
      </div>
      <footer class="foot">© 在线工具 · 开源 MIT</footer>
    
  <script>
  (function(){
    'use strict';
    const $ = s => document.querySelector(s);
    const drop = $('#drop'), file = $('#file'), ctrl = $('#ctrl');
    const cv = $('#cv'), ctx = cv.getContext('2d');
    let img = null, srcSize = 0, srcType = '';

    function load(blob){
      const url = URL.createObjectURL(blob);
      const im = new Image();
      im.onload = () => {
        img = im; srcSize = blob.size; srcType = blob.type || '';
        ctrl.style.display = '';
        $('#maxW').value = ''; $('#maxH').value = '';
        // pick a default format matching source when possible
        if(srcType === 'image/png') $('#fmt').value = 'image/png';
        else if(srcType === 'image/webp') $('#fmt').value = 'image/webp';
        else $('#fmt').value = 'image/jpeg';
        render();
        URL.revokeObjectURL(url);
      };
      im.onerror = () => { window.toast('无法解码该图片'); URL.revokeObjectURL(url); };
      im.src = url;
    }

    function render(){
      if(!img) return;
      let w = img.naturalWidth, h = img.naturalHeight;
      const maxW = parseInt($('#maxW').value, 10);
      const maxH = parseInt($('#maxH').value, 10);
      if(maxW && w > maxW){ h = Math.round(h * maxW / w); w = maxW; }
      if(maxH && h > maxH){ w = Math.round(w * maxH / h); h = maxH; }
      cv.width = w; cv.height = h;
      ctx.clearRect(0, 0, w, h);
      ctx.drawImage(img, 0, 0, w, h);
      const fmt = $('#fmt').value;
      const q = Math.max(0.1, Math.min(1, parseFloat($('#q').value) || 0.85));
      cv.toBlob((blob) => {
        if(!blob){ $('#info').innerHTML = '<span class="value">无法编码该格式</span>'; return; }
        const kbBefore = (srcSize/1024).toFixed(1);
        const kbAfter  = (blob.size/1024).toFixed(1);
        const ratio = srcSize > 0 ? ((blob.size/srcSize)*100).toFixed(1) + '%' : '—';
        $('#info').innerHTML = `
          <span class="label">原始</span><span class="value">${img.naturalWidth}×${img.naturalHeight} · ${kbBefore} KB</span>
          <span class="label">输出</span><span class="value">${w}×${h} · ${kbAfter} KB（${ratio}）</span>`;
        if(cv.dataset.outBlobUrl) URL.revokeObjectURL(cv.dataset.outBlobUrl);
        cv.dataset.outType = fmt;
        cv.dataset.outName = 'image_' + Date.now() + '.' + (fmt === 'image/jpeg' ? 'jpg' : fmt.split('/')[1]);
        cv.dataset.outBlobUrl = URL.createObjectURL(blob);
      }, fmt, q);
    }

    function bindFiles(){
      drop.addEventListener('click', () => file.click());
      file.addEventListener('change', e => {
        const f = e.target.files && e.target.files[0]; if(f) load(f);
      });
      ['dragenter','dragover'].forEach(ev => drop.addEventListener(ev, e => {
        e.preventDefault(); drop.classList.add('over');
      }));
      ['dragleave','drop'].forEach(ev => drop.addEventListener(ev, e => {
        e.preventDefault(); drop.classList.remove('over');
      }));
      drop.addEventListener('drop', e => {
        const f = e.dataTransfer.files && e.dataTransfer.files[0]; if(f) load(f);
      });
      (window.__pageOn || ((t,e,f)=>t.addEventListener(e,f)))(window, 'paste', e => {
        const items = e.clipboardData && e.clipboardData.items || [];
        for(const it of items){
          if(it.kind === 'file'){
            const f = it.getAsFile(); if(f) { load(f); break; }
          }
        }
      });
    }

    bindFiles();
    (window.__pageOn || ((t,e,f)=>t.addEventListener(e,f)))(window, 'app:page-cleanup', () => {
      if(cv.dataset.outBlobUrl){ URL.revokeObjectURL(cv.dataset.outBlobUrl); delete cv.dataset.outBlobUrl; }
    });
    $('#apply').addEventListener('click', render);
    $('#download').addEventListener('click', () => {
      if(!cv.dataset.outBlobUrl){ return window.toast('请先处理图片'); }
      const a = document.createElement('a');
      a.href = cv.dataset.outBlobUrl;
      a.download = cv.dataset.outName || 'image';
      document.body.appendChild(a); a.click(); a.remove();
    });
    $('#copyB64').addEventListener('click', () => {
      if(!cv.width){ return window.toast('请先处理图片'); }
      const fmt = $('#fmt').value;
      const q = Math.max(0.1, Math.min(1, parseFloat($('#q').value) || 0.85));
      const data = cv.toDataURL(fmt, q);
      window.copyText(data).then(ok => ok && window.toast('已复制 Base64 到剪贴板'));
    });
  })();
  </script>
    </main>
  </div>
</body>
</html>
